# Loon 常用分流配置
# 说明：
# - 不包含你的机场订阅 URL，避免把私密订阅公开到远程配置。
# - 导入本配置后，请在 Loon 中重新添加/启用你的 ghelper 节点订阅。
# - 节点筛选会从所有已添加节点中自动识别地区。

[General]
dns-server = 223.5.5.5,119.29.29.29,8.8.8.8,1.1.1.1
dns-reject-mode = LoopbackIP
domain-reject-mode = DNS
sni-sniffing = true
ip-mode = v4-only
interface-mode = auto
test-timeout = 5
disconnect-on-policy-change = false
resource-parser = https://github.com/sub-store-org/Sub-Store/releases/latest/download/sub-store-parser.loon.min.js
geoip-url = https://geodata.kelee.one/Country-Masaiki.mmdb
ipasn-url = https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb
proxy-test-url = http://cp.cloudflare.com/generate_204
internet-test-url = http://www.gstatic.com/generate_204

[Proxy]

[Remote Proxy]
# 为避免泄露订阅凭据，这里故意留空。
# 导入后请在 Loon 的节点/订阅页面重新添加你的 ghelper 订阅。
# 也可以自行取消下一行注释并替换 URL：
# ghelper = https://YOUR-SUBSCRIPTION-URL,parser-enabled=true,enabled=true

[Remote Filter]
全部节点 = NameRegex, FilterKey = "^(?!.*(?i)(流量|到期|官网|客服|订阅|套餐|剩余|重置|过期|邮箱|邀请|通知|公告)).+$"
香港 = NameRegex, FilterKey = "(?i)(香港|🇭🇰|港|HK|Hong)"
台湾 = NameRegex, FilterKey = "(?i)(台湾|台灣|🇹🇼|TW|Taiwan|Tai)"
日本 = NameRegex, FilterKey = "(?i)(日本|🇯🇵|东京|東京|大阪|JP|Japan)"
新加坡 = NameRegex, FilterKey = "(?i)(新加坡|🇸🇬|狮城|獅城|SG|Singapore)"
美国 = NameRegex, FilterKey = "(?i)(美国|美國|🇺🇸|西雅图|西雅圖|洛杉矶|洛杉磯|硅谷|圣何塞|聖何塞|US|USA|United States)"
英国 = NameRegex, FilterKey = "(?i)(英国|英國|🇬🇧|伦敦|倫敦|UK|United Kingdom|Britain)"

[Proxy Group]
节点选择 = select,自动选择,香港节点,日本节点,新加坡节点,美国节点,台湾节点,英国节点,DIRECT
自动选择 = url-test,全部节点,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50

香港节点 = url-test,香港,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50
台湾节点 = url-test,台湾,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50
日本节点 = url-test,日本,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50
新加坡节点 = url-test,新加坡,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50
美国节点 = url-test,美国,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50
英国节点 = url-test,英国,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50

AI服务 = select,美国节点,日本节点,新加坡节点,英国节点,节点选择
Google服务 = select,节点选择,香港节点,日本节点,新加坡节点,美国节点
YouTube服务 = select,节点选择,香港节点,日本节点,新加坡节点,美国节点
Telegram服务 = select,节点选择,新加坡节点,香港节点,日本节点,美国节点
Netflix服务 = select,节点选择,新加坡节点,日本节点,香港节点,美国节点
Apple服务 = select,DIRECT,节点选择,香港节点,美国节点
Microsoft服务 = select,DIRECT,节点选择,美国节点,日本节点
GitHub服务 = select,节点选择,香港节点,日本节点,美国节点

[Rule]
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,节点选择

